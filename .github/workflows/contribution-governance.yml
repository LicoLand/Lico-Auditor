name: contribution-governance

on:
  workflow_call:
    inputs:
      profile:
        description: Lico-Auditor policy profile for the caller repository.
        required: false
        default: auto
        type: string

permissions:
  contents: read

jobs:
  contribution-governance:
    name: contribution-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: target
      - name: Checkout canonical audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLand/Lico-Auditor
          ref: only
          fetch-depth: 1
          path: lico-auditor
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reject prohibited contribution metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scan_ref="$HEAD_SHA"
          if git -C target cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            scan_ref="$BASE_SHA..$HEAD_SHA"
          fi
          lico-auditor/bin/lico-auditor gate \
            --repo target \
            --profile "${{ inputs.profile }}" \
            --history \
            --ref "$scan_ref" \
            --format text
