name: lico-auditor-privacy-gate

on:
  push:
    branches:
      - only
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  audit-public-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - repository: LicoLand/LicoUp
            branch: nightly
            profile: licoup
          - repository: LicoLand/BadTower
            branch: main
            profile: badtower
          - repository: LicoLand/Fabrigent
            branch: main
            profile: fabrigent
          - repository: LicoLand/LicoArc-Plugins
            branch: main
            profile: common
          - repository: LicoLand/lico.land
            branch: main
            profile: website
          - repository: LicoLand/licoland.com
            branch: main
            profile: website
          - repository: LicoLand/licomesh.com
            branch: main
            profile: website
          - repository: LicoLand/licoup.com
            branch: main
            profile: website
          - repository: LicoLand/licoup.net
            branch: main
            profile: website
          - repository: LicoLand/licoarc.com
            branch: main
            profile: website
          - repository: LicoLand/.github
            branch: main
            profile: common
    steps:
      - name: Checkout audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLand/Lico-Auditor
          ref: only
          fetch-depth: 0
          path: lico-auditor

      - name: Verify audit source of truth
        run: |
          lico-auditor/bin/lico-auditor source-of-truth \
            --repo lico-auditor \
            --remote origin \
            --branch only \
            --require-current-head

      - name: Checkout governed target
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repository }}
          ref: ${{ matrix.target.branch }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run privacy leak gate
        run: |
          lico-auditor/bin/lico-auditor gate \
            --repo target \
            --profile ${{ matrix.target.profile }} \
            --history \
            --no-contribution \
            --format text
