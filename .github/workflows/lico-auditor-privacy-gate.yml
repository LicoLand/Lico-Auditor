name: lico-auditor-privacy-gate

on:
  push:
    branches:
      - only
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  audit-public-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - repository: LicoLand/LicoMesh
            branch: nightly
            profile: platform
          - repository: LicoLand/LicoMesh
            branch: stable
            profile: platform
          - repository: LicoLand/LicoMesh
            branch: release
            profile: platform
          - repository: LicoLand/Lico-Dev
            branch: main
            profile: skills
          - repository: LicoLand/licomesh.com
            branch: main
            profile: website
          - repository: LicoLand/.github
            branch: main
            profile: common
          - repository: LicoLand/licomesh-community
            branch: main
            profile: common
    steps:
      - name: Checkout audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLand/Lico-Auditor
          ref: only
          fetch-depth: 0
          path: lico-auditor

      - name: Verify audit source of truth
        run: |
          lico-auditor/bin/lico-auditor source-of-truth \
            --repo lico-auditor \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads

      - name: Checkout governed target
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repository }}
          ref: ${{ matrix.target.branch }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run privacy leak gate
        run: |
          lico-auditor/bin/lico-auditor gate \
            --repo target \
            --profile ${{ matrix.target.profile }} \
            --history \
            --format text

  audit-github-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLand/Lico-Auditor
          ref: only
          fetch-depth: 0
      - name: Verify audit source of truth
        run: |
          bin/lico-auditor source-of-truth \
            --repo . \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Ensure clean GitHub pull-ref surface
        run: bin/lico-auditor github-surface --all-targets
