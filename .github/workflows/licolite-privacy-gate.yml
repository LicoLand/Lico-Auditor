name: licolite-privacy-gate

on:
  push:
    branches:
      - only
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  audit-public-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - repository: LicoLite/licolite
            branch: nightly
          - repository: LicoLite/licolite
            branch: stable
          - repository: LicoLite/licolite
            branch: release
          - repository: LicoLite/licolite-skills
            branch: main
          - repository: LicoLite/licolite.com
            branch: main
          - repository: LicoLite/.github
            branch: main
          - repository: LicoLite/licolite-community
            branch: main
    steps:
      - name: Checkout audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLite/licolite-audit
          ref: only
          fetch-depth: 0
          path: licolite-audit

      - name: Verify audit source of truth
        run: |
          licolite-audit/bin/licolite-audit source-of-truth \
            --repo licolite-audit \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads

      - name: Checkout LicoLite target
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target.repository }}
          ref: ${{ matrix.target.branch }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run privacy leak gate
        run: |
          licolite-audit/bin/licolite-audit gate \
            --repo target \
            --history \
            --format text

  audit-github-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit gate
        uses: actions/checkout@v5
        with:
          repository: LicoLite/licolite-audit
          ref: only
          fetch-depth: 0
      - name: Verify audit source of truth
        run: |
          bin/licolite-audit source-of-truth \
            --repo . \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Ensure clean GitHub pull-ref surface
        run: bin/licolite-audit github-surface --all-targets
