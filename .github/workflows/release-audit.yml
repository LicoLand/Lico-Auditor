name: release-audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  final-gate:
    name: final-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical audit source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: LicoLand/Lico-Auditor
          ref: only
          fetch-depth: 0
          persist-credentials: false
          path: lico-auditor

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Verify audit source of truth
        run: |
          lico-auditor/bin/lico-auditor source-of-truth \
            --repo lico-auditor \
            --remote origin \
            --branch only \
            --require-current-head

      - name: Validate trusted caller event
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target|push|workflow_dispatch) ;;
            *)
              echo "release-audit must be called from a trusted release event" >&2
              exit 1
              ;;
          esac
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-audit requires an immutable target commit" >&2
            exit 1
          fi
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "release-audit target repository is invalid" >&2
            exit 1
          fi

      - name: Checkout candidate as data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target/${{ github.event.repository.name }}

      - name: Audit candidate contribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PATH: target/${{ github.event.repository.name }}
        run: |
          candidate_ref="$HEAD_SHA"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ ! "$BASE_SHA" =~ ^0+$ ]] &&
             git -C "$TARGET_PATH" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            candidate_ref="$BASE_SHA..$HEAD_SHA"
          elif git -C "$TARGET_PATH" cat-file -e "$HEAD_SHA^" 2>/dev/null; then
            candidate_ref="$HEAD_SHA^..$HEAD_SHA"
          fi
          lico-auditor/bin/lico-auditor gate \
            --repo "$TARGET_PATH" \
            --profile auto \
            --history \
            --ref "$candidate_ref" \
            --format text

      - name: Audit complete release history
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PATH: target/${{ github.event.repository.name }}
        run: |
          lico-auditor/bin/lico-auditor gate \
            --repo "$TARGET_PATH" \
            --profile auto \
            --history \
            --no-contribution \
            --ref "$HEAD_SHA" \
            --format text
