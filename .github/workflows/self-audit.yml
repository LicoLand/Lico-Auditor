name: self-audit

on:
  push:
    branches:
      - only
  pull_request:
    branches:
      - only
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'only' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify audit source of truth
        if: github.event_name != 'pull_request'
        run: |
          bin/lico-auditor source-of-truth \
            --repo . \
            --remote origin \
            --branch only \
            --require-current-head
      - name: Verify audit package on pull request
        if: github.event_name == 'pull_request'
        run: |
          test -x bin/lico-auditor
          bin/lico-auditor --help >/dev/null
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit this repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scan_ref="$HEAD_SHA"
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            scan_ref="$BASE_SHA..$HEAD_SHA"
          fi
          bin/lico-auditor gate --repo . --history --ref "$scan_ref"
