name: self-audit

on:
  push:
    branches:
      - only
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: only
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify audit source of truth
        run: |
          bin/lico-auditor source-of-truth \
            --repo . \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit this repository
        run: bin/lico-auditor gate --repo . --history
