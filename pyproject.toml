[project]
name = "licolite-audit"
version = "0.1.0"
description = "External privacy and release audit gate for LicoLite repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "LicoLite Maintainers" }
]

[project.scripts]
licolite-audit = "licolite_audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
