[project]
name = "lico-auditor"
version = "0.1.0"
description = "External privacy and release audit gate for governed LicoMesh and LicoArc repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "LicoLand Maintainers" }
]

[project.scripts]
lico-auditor = "lico_auditor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
